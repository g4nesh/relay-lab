[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "relay-lab"
version = "0.1.0"
description = "A small, original two-robot communication sandbox in MuJoCo"
requires-python = ">=3.12"
dependencies = [
  "mujoco>=3.2,<4",
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "imageio>=2.35,<3",
  "imageio-ffmpeg>=0.5,<1",
]

[project.optional-dependencies]
vla = ["lerobot[smolvla]==0.6.1"]
learned = ["torch==2.11.0"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
relay-lab = "relay_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
